[package]
name = "rpk-studio"
version = "2.1.0"
description = "RPK Studio 的原生外壳"
authors = ["hrk666666"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rpk_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
