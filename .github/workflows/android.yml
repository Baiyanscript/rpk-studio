name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/src-tauri -> target

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend
        run: |
          cd android
          npm install --no-audit --no-fund
          node build-app.mjs

      - name: Init Android project
        run: |
          cd android
          ./node_modules/.bin/tauri android init --ci --skip-targets-install

      - name: Build APK
        run: |
          cd android
          ./node_modules/.bin/tauri android build --apk --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: rpk-studio-android-arm64-debug
          path: android/src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
